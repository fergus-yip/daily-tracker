<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Fergus’s daily YouTube + X and weekly launches digest tracker" />
  <title>Daily Tracker</title>
  <link rel="stylesheet" href="assets/styles.css?v=light1" />
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="brand">
        <p class="eyebrow">Fergus · team</p>
        <h1>Daily Tracker</h1>
        <p class="sub" id="brand-sub">YouTube + X · last 30 days</p>
      </div>
      <p id="updated-meta" class="meta" hidden></p>
    </header>

    <nav class="cadence" role="tablist" aria-label="Cadence">
      <button class="cadence-btn is-active" data-cadence="daily" role="tab" aria-selected="true" type="button">
        <span class="cadence-label">Daily</span>
        <span class="unread-dot" data-dot="daily" hidden aria-hidden="true"></span>
      </button>
      <button class="cadence-btn" data-cadence="weekly" role="tab" aria-selected="false" type="button">
        <span class="cadence-label">Weekly</span>
        <span class="unread-dot" data-dot="weekly" hidden aria-hidden="true"></span>
      </button>
    </nav>

    <nav class="tabs" id="tabs-daily" role="tablist" aria-label="Daily views">
      <button class="tab is-active" data-view="today" role="tab" aria-selected="true" aria-label="Today">
        <span class="tab-full">Today</span><span class="tab-short" aria-hidden="true">Today</span>
      </button>
      <button class="tab" data-view="by-day" role="tab" aria-selected="false" aria-label="By day">
        <span class="tab-full">By day</span><span class="tab-short" aria-hidden="true">By day</span>
      </button>
      <button class="tab" data-view="search" role="tab" aria-selected="false" aria-label="Search">
        <span class="tab-full">Search</span><span class="tab-short" aria-hidden="true">Search</span>
      </button>
      <button class="tab" data-view="youtube" role="tab" aria-selected="false" aria-label="YouTube">
        <span class="tab-full">YouTube</span><span class="tab-short" aria-hidden="true">YT</span>
      </button>
      <button class="tab" data-view="x" role="tab" aria-selected="false" aria-label="X">
        <span class="tab-full">X</span><span class="tab-short" aria-hidden="true">X</span>
      </button>
    </nav>

    <nav class="tabs" id="tabs-weekly" role="tablist" aria-label="Weekly views" hidden>
      <button class="tab is-active" data-view="this-week" role="tab" aria-selected="true" aria-label="This week">
        <span class="tab-full">This week</span><span class="tab-short" aria-hidden="true">This week</span>
      </button>
      <button class="tab" data-view="by-week" role="tab" aria-selected="false" aria-label="By week">
        <span class="tab-full">By week</span><span class="tab-short" aria-hidden="true">By week</span>
      </button>
      <button class="tab" data-view="search-weekly" role="tab" aria-selected="false" aria-label="Search">
        <span class="tab-full">Search</span><span class="tab-short" aria-hidden="true">Search</span>
      </button>
      <button class="tab" data-view="launches" role="tab" aria-selected="false" aria-label="Launches">
        <span class="tab-full">Launches</span><span class="tab-short" aria-hidden="true">Launches</span>
      </button>
    </nav>

    <main id="main" class="main" aria-live="polite">
      <p class="loading">Loading digests…</p>
    </main>

    <footer class="site-footer">
      <p>Public skim board · no bookmarks · data under <code>/data</code></p>
    </footer>
  </div>
  <script src="assets/app.js?v=light1" defer></script>
</body>
</html>
